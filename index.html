/* ════════════════════════════════════════
   RECEIPT SCANNER — camera → AI → expense
════════════════════════════════════════ */
function ReceiptScanner({trip,onAdd,onClose}){
  const[img,setImg]=useState('');
  const[scanning,setScanning]=useState(false);
  const[result,setResult]=useState(null);
  const[err,setErr]=useState('');
  const imgRef=useRef();

  function handleFile(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=ev=>setImg(ev.target.result);r.readAsDataURL(file);
  }

  async function scan(){
    if(!img){setErr('請先拍照或選擇收據圖片');return}
    const apiKey=localStorage.getItem('anthropic-key')||'';
    setScanning(true);setErr('');setResult(null);
    try{
      const base64=img.split(',')[1];
      const resp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-5',max_tokens:400,
          messages:[{role:'user',content:[
            {type:'image',source:{type:'base64',media_type:'image/jpeg',data:base64}},
            {type:'text',text:`從這張收據圖片提取消費資訊，只返回JSON，不要其他文字：
{"name":"店名或消費描述","amount":"數字","currency":"${trip.currency||'HKD'}","cat":"Dine-out","notes":"","date":"${new Date().toISOString().slice(0,10)}"}
cat只能是：Personal/Grocery/Dressing/Dine-out/Cats/Car/Transport/Leisure/Travel
amount只要數字，不含貨幣符號`}
          ]}]
        })
      });
      if(!resp.ok)throw new Error('API '+resp.status);
      const d=await resp.json();
      const raw=d.content.map(b=>b.text||'').join('').replace(/\`\`\`json|\`\`\`/g,'').trim();
      setResult(JSON.parse(raw));
    }catch(e){setErr('掃描失敗: '+e.message)}
    setScanning(false);
  }

  return <Modal title="📷 掃描收據" onClose={onClose}>
    <div style={{marginBottom:12}}>
      <div style={{display:'flex',gap:8,marginBottom:10}}>
        <button className="btn btn-sm" style={{flex:1}} onClick={()=>{imgRef.current.removeAttribute('capture');imgRef.current.click()}}>📁 選擇圖片</button>
        <button className="btn btn-sm" style={{flex:1}} onClick={()=>{imgRef.current.setAttribute('capture','environment');imgRef.current.click()}}>📷 拍攝收據</button>
      </div>
      <input ref={imgRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFile}/>
      {img&&<img src={img} className="receipt-preview" alt="receipt"/>}
    </div>
    {img&&<button className="btn btn-indigo" style={{width:'100%',marginBottom:12}} onClick={scan} disabled={scanning}>
      {scanning&&<span className="ai-spin"/>}{scanning?'AI 識別中…':'✨ AI 識別收據'}
    </button>}
    {err&&<div className="alert-box alert-danger" style={{marginBottom:10}}>{err}</div>}
    {result&&<div>
      <div style={{background:'var(--washi2)',border:'1.5px solid var(--border)',borderRadius:4,padding:'11px 13px',marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>✅ 識別結果</div>
        <div style={{fontSize:13,marginBottom:4}}><b>{result.name}</b></div>
        <div style={{fontSize:13,color:'var(--persimmon)',fontWeight:700}}>{result.currency} {result.amount}</div>
        <div style={{fontSize:11,opacity:.5,marginTop:3}}>{result.cat} · {result.date}</div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn" style={{flex:1}} onClick={onClose}>取消</button>
        <button className="btn btn-primary" style={{flex:1}} onClick={()=>{onAdd(result);onClose()}}>加入記帳</button>
      </div>
    </div>}
    {!result&&img&&!scanning&&<div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
      <button className="btn" onClick={onClose}>取消</button>
    </div>}
    {!img&&<div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
      <button className="btn" onClick={onClose}>取消</button>
    </div>}
  </Modal>
}


/* ════════════════════════════════════════
   GOOGLE SHEETS EXPORT via CSV download
   (Sheets can import CSV directly)
════════════════════════════════════════ */
function exportToCSV(trip){
  /* Requested columns: Date | Category | Item & Note | Amount */
  const rows=[['Date','Category','Item & Note','Amount']];
  (trip.expenses||[]).forEach(e=>{
    /* Combine the item name and any note into a single "Item & Note" cell */
    const itemNote=e.notes&&String(e.notes).trim()
      ? `${e.name||''} — ${e.notes}`
      : (e.name||'');
    /* Amount keeps the currency code so mixed-currency rows stay unambiguous */
    const amount=e.currency&&e.currency!==(trip.currency||'')
      ? `${e.amount||''} ${e.currency}`
      : `${e.amount||''}`;
    rows.push([e.date||'', e.cat||'', itemNote, amount]);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const bom='\uFEFF';
  /* Use data URI — works everywhere including iframes and GitHub Pages */
  try{
    const blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`${trip.name}-expenses.csv`;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a)},200);
    showToast('✓ CSV 已下載！在 Google Sheets 選擇「檔案→匯入」開啟');
  }catch(e){
    /* Fallback: data URI (always works) */
    const dataUri='data:text/csv;charset=utf-8,'+encodeURIComponent(bom+csv);
    const a=document.createElement('a');
    a.href=dataUri;a.download=`${trip.name}-expenses.csv`;
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    showToast('✓ CSV 已下載！在 Google Sheets 選擇「檔案→匯入」開啟');
  }
}

/* ═══════════════════════════════════════════════
   TAB: BUDGET — #4 daily pace bar
═══════════════════════════════════════════════ */
function BudgetTab({trip,setTrip}){
  const{rates,updated,convFrom,convTo,setConvFrom,setConvTo}=useFXRates();
  const[filter,setFilter]=useState('全部');
  const[showAdd,setShowAdd]=useState(false);
  const[showReceipt,setShowReceipt]=useState(false);
  const[convAmt,setConvAmt]=useState('1000');
  const[editingBudget,setEditingBudget]=useState(false);
  const[budgetDraft,setBudgetDraft]=useState('');
  const expenses=trip.expenses||[];
  const cur=trip.currency||'HKD';
  const total=Number(trip.budget||0);
  const toBase=e=>{const rf=rates[e.currency]||FX_FALLBACK[e.currency]||1;const rb=rates[cur]||FX_FALLBACK[cur]||1;return Number(e.amount)/rf*rb};
  const spent=expenses.reduce((s,e)=>s+toBase(e),0);
  const remaining=total-spent;
  const pct=total?Math.min(120,spent/total*100):0;
  const filtered=filter==='全部'?expenses:expenses.filter(e=>e.cat===filter);

  /* #4 daily pace */
  const today=new Date().toISOString().slice(0,10);
  const tripStart=trip.startDate;
  const daysPassed=Math.max(1,Math.min(trip.duration||1,Math.ceil((new Date(today)-new Date(tripStart))/86400000)+1));
  const dailyBudget=total/(trip.duration||1);
  const dailyActual=spent/daysPassed;
  const paceOk=dailyActual<=dailyBudget*1.1;

  const catTotals=useMemo(()=>CAT_EX.reduce((a,c)=>{a[c]=expenses.filter(e=>e.cat===c).reduce((s,e)=>s+toBase(e),0);return a},{}),[expenses,rates]);
  const pieData=CAT_EX.map((c,i)=>({name:c,value:Math.round(catTotals[c]||0),fill:PIE_COLORS[i%PIE_COLORS.length]})).filter(d=>d.value>0);
  const convResult=useMemo(()=>{if(!convAmt)return'';const f=rates[convFrom]||FX_FALLBACK[convFrom]||1,t=rates[convTo]||FX_FALLBACK[convTo]||1;return(Number(convAmt)/f*t).toFixed(2)},[convAmt,convFrom,convTo,rates]);
  function add(e){setTrip(t=>({...t,expenses:[...(t.expenses||[]),{...e,id:uid()}]}));setShowAdd(false)}
  function del(id){const r=expenses.find(x=>x.id===id);setTrip(t=>({...t,expenses:(t.expenses||[]).filter(x=>x.id!==id)}));showToast(`已刪除「${r?.name}」`,()=>setTrip(t=>({...t,expenses:[...(t.expenses||[]),r]})))}
  const{PieChart,Pie,Cell,Tooltip,ResponsiveContainer}=window.Recharts||{};

  return <div style={{padding:'14px 14px 0'}}>
    {pct>=100&&<div className="alert-box alert-danger">⚠️ 已超出預算 {cur} {Math.round(Math.abs(remaining)).toLocaleString()}</div>}
    {pct>=80&&pct<100&&<div className="alert-box alert-warn">🔔 已使用 {Math.round(pct)}% 預算</div>}
    <div className="grid-3" style={{marginBottom:10}}>
      <div className="summary-card" style={{cursor:'pointer'}} onClick={()=>{if(!editingBudget){setBudgetDraft(String(trip.budget||0));setEditingBudget(true)}}}>
        <div style={{fontSize:9,opacity:.4}}>總預算</div>
        {editingBudget
          ? <div onClick={e=>e.stopPropagation()} style={{display:'flex',flexDirection:'column',gap:4,marginTop:3}}>
              <select value={cur}
                onMouseDown={e=>e.stopPropagation()}
                onChange={e=>{e.stopPropagation();setTrip(t=>({...t,currency:e.target.value}))}}
                style={{width:'100%',fontSize:11,padding:'3px 4px',border:'1.5px solid var(--border-soft)',borderRadius:3,background:'var(--paper)',fontFamily:'inherit',color:'var(--ink)'}}>
                {CURRENCIES.map(c=><option key={c}>{c}</option>)}
              </select>
              <input type="number" value={budgetDraft} onChange={e=>setBudgetDraft(e.target.value)}
                onBlur={e=>{
                  /* Delay close so clicking the select above doesn't immediately dismiss */
                  setTimeout(()=>{
                    setTrip(t=>({...t,budget:Number(budgetDraft)||0}));
                    setEditingBudget(false);
                  },150);
                }}
                onKeyDown={e=>{if(e.key==='Enter'||e.key==='Escape'){setTrip(t=>({...t,budget:Number(budgetDraft)||0}));setEditingBudget(false)}}}
                style={{width:'100%',fontSize:13,padding:'3px 5px',border:'1.5px solid var(--indigo)',borderRadius:3,background:'var(--paper)',fontFamily:'inherit',color:'var(--ink)',fontWeight:700}}/>

                style={{fontSize:11,padding:'4px 0'}}>✓ 儲存</button>
            </div>
          : <div className="summary-num" style={{fontSize:14}}>{cur} {Number(total).toLocaleString()}<span style={{fontSize:9,opacity:.3,marginLeft:3}}>✎</span></div>
        }

      <div style={{display:'flex',justifyContent:'space-between',marginBottom:5,fontSize:12}}><span>預算進度</span><span style={{fontWeight:700,color:pct>=100?'#8b2a2a':pct>=80?'var(--gold)':'var(--moss)'}}>{Math.round(pct)}%</span></div>
      <div className="progress-bar"><div className="progress-fill" style={{width:`${Math.min(100,pct)}%`,background:pct>=100?'#8b2a2a':pct>=80?'var(--gold)':trip.color||'var(--moss)'}}/></div>
      {/* #4 daily pace bar */}
      {trip.duration>1&&<div style={{marginTop:9}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:4,opacity:.65}}>

        </div>
        <div style={{fontSize:10,opacity:.4,marginTop:3}}>第 {daysPassed} / {trip.duration} 天</div>

    {/* Pie chart */}

          {pieData.map((e,i)=><Cell key={i} fill={e.fill} stroke="var(--paper)" strokeWidth={2}/>)}
        </Pie><Tooltip formatter={v=>[`${cur} ${v.toLocaleString()}`,'']} contentStyle={{fontFamily:'inherit',fontSize:11,background:'var(--paper)',border:'1px solid var(--border)'}}/></PieChart>
      </ResponsiveContainer>
      <div style={{display:'flex',flexWrap:'wrap',gap:'3px 9px',justifyContent:'center',marginTop:3}}>
        {pieData.map(d=><span key={d.name} style={{fontSize:10,display:'flex',alignItems:'center',gap:3}}><span style={{width:7,height:7,borderRadius:'50%',background:d.fill,display:'inline-block'}}/>{d.name} {Math.round(d.value/spent*100)||0}%</span>)}
      </div>
    </div>}

    {/* #12 Currency converter - remember last pair */}
    <div className="card" style={{padding:'8px 12px',marginBottom:10,overflow:'hidden'}}>
      <div className="section-title" style={{marginBottom:5}}>即時換算 <span style={{textTransform:'none',letterSpacing:0,fontWeight:400,fontSize:10}}>{updated}</span></div>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <select value={convFrom} onChange={e=>setConvFrom(e.target.value)}
          style={{flex:1,minWidth:0,fontSize:12,padding:'5px 5px',border:'1.5px solid var(--border-soft)',borderRadius:3,background:'var(--paper)',fontFamily:'inherit',color:'var(--ink)'}}>
          {CURRENCIES.map(c=><option key={c}>{c}</option>)}
        </select>
        <span style={{opacity:.35,fontSize:13,flexShrink:0}}>→</span>
        <select value={convTo} onChange={e=>setConvTo(e.target.value)}
          style={{flex:1,minWidth:0,fontSize:12,padding:'5px 5px',border:'1.5px solid var(--border-soft)',borderRadius:3,background:'var(--paper)',fontFamily:'inherit',color:'var(--ink)'}}>
          {CURRENCIES.map(c=><option key={c}>{c}</option>)}
        </select>
      </div>
      <div style={{display:'flex',gap:6,alignItems:'center',marginTop:6}}>
        <input type="number" value={convAmt} onChange={e=>setConvAmt(e.target.value)}
          style={{flex:1,minWidth:0,width:'100%',fontSize:13,padding:'5px 8px',border:'1.5px solid var(--border-soft)',borderRadius:3,background:'var(--paper)',fontFamily:'inherit',color:'var(--ink)'}}/>
        <span style={{opacity:.35,fontSize:13,flexShrink:0}}>＝</span>
        <div style={{flex:1,minWidth:0,background:'var(--washi2)',border:'1.5px solid var(--border-soft)',borderRadius:3,padding:'5px 8px',fontWeight:700,fontSize:13,color:'var(--indigo)',fontFamily:"'Shippori Mincho',serif",textAlign:'right',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{convResult||'—'}</div>

    <div style={{display:'flex',gap:5,marginBottom:9,flexWrap:'wrap',alignItems:'center'}}>

      <button className="btn btn-sm" style={{marginLeft:'auto',background:'var(--indigo)',color:'var(--washi)',border:'none'}} onClick={()=>setShowReceipt(true)}>📷 掃描</button>

    {filtered.length===0&&<div style={{textAlign:'center',padding:'20px',opacity:.3,fontSize:12}}>暫無記錄</div>}

        <button onClick={()=>del(e.id)} style={{background:'none',border:'none',cursor:'pointer',opacity:.3,fontSize:13}}>✕</button>

/* ═══════════════════════════════════════════════
   TAB: SHOPPING — photo with separate img storage (#1)
═══════════════════════════════════════════════ */
function ShoppingTab({trip,setTrip}){
  const[filter,setFilter]=useState('全部');
  const[showAdd,setShowAdd]=useState(false);
  const[editItem,setEditItem]=useState(null);
  const[form,setForm]=useState({name:'',cat:'購物',url:''});/* #8 url field */
  const[imgPreview,setImgPreview]=useState('');
  const imgRef=useRef();
  const items=trip.shopping||[];
  const bought=items.filter(i=>i.done).length;
  const filtered=filter==='全部'?items:items.filter(i=>i.cat===filter);

  function toggle(id){setTrip(t=>({...t,shopping:(t.shopping||[]).map(x=>x.id===id?{...x,done:!x.done}:x)}))}
  function del(id){
    const r=items.find(x=>x.id===id);
    deleteImg(id);
    setTrip(t=>({...t,shopping:(t.shopping||[]).filter(x=>x.id!==id)}));
    showToast(`已刪除「${r?.name}」`,()=>setTrip(t=>({...t,shopping:[...(t.shopping||[]),r]})));
  }
  function openAdd(){setForm({name:'',cat:'購物',url:''});setImgPreview('');setEditItem(null);setShowAdd(true)}
  function openEdit(item){setForm({name:item.name,cat:item.cat,url:item.url||''});setImgPreview(loadImg(item.id));setEditItem(item);setShowAdd(true)}
  function handleImg(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setImgPreview(ev.target.result);r.readAsDataURL(f)}
  function save(){
    if(!form.name)return;
    if(editItem){
      if(imgPreview)saveImg(editItem.id,imgPreview);
      else if(!imgPreview)deleteImg(editItem.id);
      setTrip(t=>({...t,shopping:(t.shopping||[]).map(x=>x.id===editItem.id?{...x,...form}:x)}));
    }else{
      const newId=uid();
      if(imgPreview)saveImg(newId,imgPreview);
      setTrip(t=>({...t,shopping:[...(t.shopping||[]),{...form,id:newId,done:false}]}));
    }
    setShowAdd(false);setEditItem(null);
  }

  return <div style={{padding:'14px 14px 0'}}>
    <div className="grid-2" style={{marginBottom:10}}>
      <div className="summary-card"><div style={{fontSize:9,opacity:.4}}>待購</div><div className="summary-num">{items.length-bought}</div></div>
      <div className="summary-card"><div style={{fontSize:9,opacity:.4}}>已買</div><div className="summary-num" style={{color:'var(--moss)'}}>{bought}</div></div>
    </div>
    <div style={{display:'flex',gap:5,marginBottom:10,flexWrap:'wrap',alignItems:'center'}}>
      {['全部',...CAT_SH].map(c=><button key={c} className={`pill ${filter===c?'active':''}`} onClick={()=>setFilter(c)}>{c}</button>)}
      <button className="btn btn-primary btn-sm" style={{marginLeft:'auto'}} onClick={openAdd}>＋</button>
    </div>
    {filtered.length===0&&<div className="empty-state"><div className="emoji">🛍</div><div>心願清單空空的</div></div>}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9}}>
      {filtered.map(item=>{
        const img=loadImg(item.id);
        return <div key={item.id} onClick={()=>openEdit(item)} style={{background:'var(--paper)',border:`1.5px solid ${item.done?'var(--moss)':'var(--border-soft)'}`,borderRadius:6,overflow:'hidden',cursor:'pointer',opacity:item.done?.5:1,boxShadow:item.done?'none':'var(--shadow-ink)',transition:'all .2s'}}>
          <div style={{position:'relative',background:'var(--washi2)',height:96,display:'flex',alignItems:'center',justifyContent:'center'}}>
            {img?<img src={img} alt={item.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<span style={{fontSize:30,opacity:.25}}>{CAT_EMOJI[item.cat]||'🛍'}</span>}
            <div onClick={e=>{e.stopPropagation();toggle(item.id)}} style={{position:'absolute',top:4,right:4,width:20,height:20,borderRadius:'50%',background:item.done?'var(--moss)':'rgba(255,255,255,.85)',border:`2px solid ${item.done?'var(--moss)':'var(--border)'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'white',cursor:'pointer'}}>
              {item.done&&'✓'}
            </div>
          </div>
          <div style={{padding:'6px 8px 8px'}}>
            <div style={{fontSize:12,fontWeight:600,lineHeight:1.3,textDecoration:item.done?'line-through':'none'}}>{item.name}</div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}}>
              <span style={{fontSize:10,opacity:.4,background:'var(--washi2)',padding:'1px 5px',borderRadius:2}}>{item.cat}</span>
              {item.url&&<a href={item.url} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} style={{fontSize:10,color:'var(--indigo)',textDecoration:'none'}}>🔗</a>}
              <button onClick={e=>{e.stopPropagation();del(item.id)}} style={{background:'none',border:'none',cursor:'pointer',opacity:.25,fontSize:12,padding:0}}>✕</button>
            </div>
          </div>
        </div>
      })}
    </div>
    {showAdd&&<Modal title={editItem?'編輯心願':'新增心願'} onClose={()=>{setShowAdd(false);setEditItem(null)}}>
      <div style={{marginBottom:12}}>
        <label style={{display:'block',fontSize:11,fontWeight:700,opacity:.7,marginBottom:5,letterSpacing:'.06em'}}>商品圖片</label>
        <div style={{display:'flex',gap:10}}>
          <div onClick={()=>imgRef.current?.click()} style={{width:84,height:84,border:'2px dashed var(--border)',borderRadius:5,overflow:'hidden',cursor:'pointer',background:'var(--washi2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            {imgPreview?<img src={imgPreview} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<div style={{textAlign:'center',opacity:.4}}><div style={{fontSize:20}}>📷</div><div style={{fontSize:9,marginTop:2}}>點擊上傳</div></div>}
          </div>
          {/* #8 camera capture */}
          <div style={{flex:1,fontSize:11,opacity:.5,lineHeight:1.8}}>
            <div>📁 檔案 · 📸 相機</div>
            <button className="btn btn-sm" style={{marginTop:4,fontSize:10}} onClick={()=>{imgRef.current.removeAttribute('capture');imgRef.current.click()}}>選擇檔案</button>
            <button className="btn btn-sm" style={{marginTop:4,marginLeft:4,fontSize:10}} onClick={()=>{imgRef.current.setAttribute('capture','camera');imgRef.current.click()}}>開啟相機</button>
            {imgPreview&&<button className="btn btn-sm" style={{marginTop:4,marginLeft:4,fontSize:10,color:'#8b2a2a'}} onClick={()=>setImgPreview('')}>移除</button>}
          </div>
        </div>
        <input ref={imgRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleImg}/>
      </div>
      <Field label="物品名稱"><input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="想買的東西"/></Field>
      <Field label="類別"><select value={form.cat} onChange={e=>setForm(p=>({...p,cat:e.target.value}))}>{CAT_SH.map(c=><option key={c}>{c}</option>)}</select></Field>
      {/* #8 product URL */}
      <Field label="商品連結 (可選)"><input value={form.url||''} onChange={e=>setForm(p=>({...p,url:e.target.value}))} placeholder="https://…" type="url"/></Field>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}><button className="btn" onClick={()=>{setShowAdd(false);setEditItem(null)}}>取消</button><button className="btn btn-primary" onClick={save}>{editItem?'更新':'新增'}</button></div>
    </Modal>}
  </div>
}

function PrepItemModal({item,onSave,onClose}){
  const[f,setF]=useState({name:item?.name||'',cat:item?.cat||'日用品',qty:item?.qty||1,notes:item?.notes||''});
  const u=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  return <Modal title={item?'編輯物品':'新增物品'} onClose={onClose}>
    <Field label="物品名稱"><input value={f.name} onChange={u('name')} placeholder="行李物品"/></Field>
    
      <Field label="類別">
        <select value={f.cat} onChange={u('cat')}>
          {CAT_PR.map(c=><option key={c}>{c}</option>)}
        </select>
      </Field>
      <Field label="數量">
        <input type="number" min="1" value={f.qty} onChange={e=>setF(p=>({...p,qty:Math.max(1,Number(e.target.value)||1)}))}/>

    <Field label="備注（可選）">

function PrepTab({trip,setTrip,allTrips}){
  const[filter,setFilter]=useState('全部');
  const[editingItem,setEditingItem]=useState(null);/* null = closed, 'new' = add, item = edit */
  const[showCopy,setShowCopy]=useState(false);
  const items=trip.prep||[];
  const done=items.filter(i=>i.done).length;
  const pct=items.length?done/items.length*100:0;
  const filtered=filter==='全部'?items:items.filter(i=>i.cat===filter);

  function toggle(id){setTrip(t=>({...t,prep:(t.prep||[]).map(x=>x.id===id?{...x,done:!x.done}:x)}))}

  function del(id){
    const r=items.find(x=>x.id===id);
    setTrip(t=>({...t,prep:(t.prep||[]).filter(x=>x.id!==id)}));
    showToast(`已刪除「${r?.name}」`,()=>setTrip(t=>({...t,prep:[...(t.prep||[]),r]})));
  }

  function saveItem(f){
    if(editingItem==='new'){
      setTrip(t=>({...t,prep:[...(t.prep||[]),{...f,id:uid(),done:false}]}));
    } else {
      setTrip(t=>({...t,prep:(t.prep||[]).map(x=>x.id===editingItem.id?{...x,...f}:x)}));
    }
    setEditingItem(null);
  }

  function adjustQty(id,delta){
    setTrip(t=>({...t,prep:(t.prep||[]).map(x=>x.id===id?{...x,qty:Math.max(1,(x.qty||1)+delta)}:x)}));
  }

  return <div style={{padding:'14px 14px 0'}}>
    {/* Progress card */}
    <div className="card" style={{padding:'12px 14px',marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
        <span style={{fontSize:12,fontWeight:500}}>準備進度</span>
        <span style={{fontWeight:700,fontSize:12,color:pct===100?'var(--moss)':'var(--ink-soft)'}}>{done} / {items.length} 項</span>
      </div>
      <div className="progress-bar">
        <div className="progress-fill" style={{width:`${pct}%`,background:pct===100?'var(--moss)':trip.color||'var(--ink-soft)'}}/>
      </div>
      {pct===100&&<div style={{textAlign:'center',marginTop:8,fontSize:12,color:'var(--moss)',fontWeight:700}}>✅ 全部準備完成！出發吧！</div>}
    </div>

    {/* Filter pills + action buttons */}
    <div style={{display:'flex',gap:5,marginBottom:11,flexWrap:'wrap',alignItems:'center'}}>
      {['全部',...CAT_PR].map(c=>(
        <button key={c} className={`pill ${filter===c?'active':''}`} onClick={()=>setFilter(c)}>{c}</button>
      ))}
      <div style={{marginLeft:'auto',display:'flex',gap:5,flexShrink:0}}>
        {(allTrips||[]).filter(t=>t.id!==trip.id&&(t.prep||[]).length>0).length>0&&(
          <button className="btn btn-sm" onClick={()=>setShowCopy(true)}>📋 複製</button>
        )}
        <button className="btn btn-sm" title="補充所有缺少的預設物品" onClick={()=>{
          const existing=new Set((trip.prep||[]).map(p=>p.name));
          const missing=DEFAULT_PREP.filter(p=>!existing.has(p.name));
          if(missing.length===0){showToast('✓ 所有預設物品已存在');return}
          setTrip(t=>({...t,prep:[...(t.prep||[]),...missing.map(p=>({...p,id:uid()}))]}));
          showToast(`✓ 已補充 ${missing.length} 個預設物品`);
        }}>🔄 補充預設</button>
        <button className="btn btn-primary btn-sm" onClick={()=>setEditingItem('new')}>＋ 新增</button>
      </div>
    </div>

    {/* Hint text for long-press/tap to edit */}
    {filtered.length>0&&<div style={{fontSize:10,opacity:.35,marginBottom:8,textAlign:'center',letterSpacing:'.04em'}}>
      點擊物品名稱可編輯
    </div>}

    {filtered.length===0&&<div className="empty-state"><div className="emoji">🧳</div><div>還沒有行李清單</div></div>}

    {filtered.map(item=>(
      <div key={item.id} className="shop-item animate-in"

   (Manual: user saves to iCloud/Google Drive)

function BackupPanel({trips,onRestore}){
  const[restoreErr,setRestoreErr]=useState('');
  const fileRef=useRef();

  function exportAll(){
    const data=JSON.stringify({version:5,trips,exportedAt:new Date().toISOString()},null,2);
    const blob=new Blob([data],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`旅行計劃-備份-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    showToast('✓ 備份已下載，請保存到 iCloud Drive 或 Google Drive');
  }

  function handleImport(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.trips||!Array.isArray(data.trips))throw new Error('格式不正確');
        onRestore(data.trips);
        showToast(`✓ 已還原 ${data.trips.length} 個行程`);
        setRestoreErr('');
      }catch(e){setRestoreErr('匯入失敗: '+e.message)}
    };
    r.readAsText(file);
    e.target.value='';
  }

  return <div style={{background:'var(--washi2)',border:'1.5px solid var(--border-soft)',borderRadius:4,padding:'12px 14px',marginBottom:14}}>
    <div style={{fontWeight:700,fontSize:12,marginBottom:6}}>☁️ 備份與還原</div>
    <div style={{fontSize:11,opacity:.55,lineHeight:1.7,marginBottom:10}}>
      匯出所有行程資料為 JSON 檔案，可保存到 iCloud Drive、Google Drive 或電腦。
      還原時選擇之前匯出的 JSON 檔案。
    </div>
    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
      <button className="btn btn-sm btn-primary" onClick={exportAll}>⬇️ 備份所有行程</button>
      <button className="btn btn-sm" onClick={()=>fileRef.current?.click()}>⬆️ 從備份還原</button>
    </div>
    <input ref={fileRef} type="file" accept=".json" style={{display:'none'}} onChange={handleImport}/>
    {restoreErr&&<div style={{fontSize:11,color:'#8b2a2a',marginTop:6}}>{restoreErr}</div>}
  </div>
}

/* ══════════════════════════════════════════════════════
   API KEY MANAGER — PIN-protected, localStorage only
   Keys are NEVER saved in trip data, shared links, or exports.
   A 4-digit PIN gates all key reveal/edit actions so that
   random visitors to your GitHub Pages cannot steal keys.
══════════════════════════════════════════════════════ */

/* Low-level PIN helpers — hash stored, never raw PIN */
async function hashPin(pin){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('showatravel-pin-v1:'+pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function getPinHash(){return localStorage.getItem('app-pin-hash')||''}
async function checkPin(pin){return(await hashPin(pin))===getPinHash()}
async function setPin(pin){localStorage.setItem('app-pin-hash',await hashPin(pin))}
function clearPin(){localStorage.removeItem('app-pin-hash')}
function hasPin(){return!!getPinHash()}

/* Simple PIN entry dialog */
function PinDialog({title,subtitle,onSuccess,onCancel,isSetup=false}){
  const[pin,setPin]=useState('');
  const[confirm,setConfirm]=useState('');
  const[err,setErr]=useState('');
  const[busy,setBusy]=useState(false);
  const ref=useRef();
  useEffect(()=>{setTimeout(()=>ref.current?.focus(),80)},[]);

  async function submit(){
    if(busy)return;
    if(pin.length<4){setErr('請輸入至少4位數字');return}
    setBusy(true);setErr('');
    if(isSetup){
      if(pin!==confirm){setErr('兩次輸入不一致');setBusy(false);return}
      await setPin(pin);
      onSuccess();
    }else{
      if(await checkPin(pin)){onSuccess()}
      else{setErr('PIN 碼錯誤，請再試');setPin('');setBusy(false)}
    }
  }

  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onCancel()}}>
    <div className="modal animate-in" style={{maxWidth:320}}>
      <div className="modal-header">
        <span className="showa-title" style={{fontWeight:700,fontSize:14}}>🔒 {title}</span>
        <button className="btn" onClick={onCancel} style={{padding:'3px 8px',fontSize:14}}>✕</button>
      </div>
      <div className="modal-body">
        {subtitle&&<div style={{fontSize:12,opacity:.6,marginBottom:12,lineHeight:1.6}}>{subtitle}</div>}
        <div style={{marginBottom:12}}>
          <label style={{display:'block',fontSize:11,fontWeight:700,opacity:.6,marginBottom:5}}>
            {isSetup?'設定 PIN 碼（至少4位）':'輸入 PIN 碼'}
          </label>
          <input ref={ref} type="password" inputMode="numeric" maxLength={8}
            value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,''))}
            onKeyDown={e=>e.key==='Enter'&&!isSetup&&submit()}
            placeholder="••••"
            style={{width:'100%',padding:'10px 12px',border:'1.5px solid var(--border-soft)',
              borderRadius:3,fontFamily:'monospace',fontSize:20,letterSpacing:8,
              background:'var(--paper)',color:'var(--ink)',outline:'none',textAlign:'center'}}/>
        </div>
        {isSetup&&<div style={{marginBottom:12}}>
          <label style={{display:'block',fontSize:11,fontWeight:700,opacity:.6,marginBottom:5}}>確認 PIN 碼</label>
          <input type="password" inputMode="numeric" maxLength={8}
            value={confirm} onChange={e=>setConfirm(e.target.value.replace(/\D/g,''))}
            onKeyDown={e=>e.key==='Enter'&&submit()}
            placeholder="••••"
            style={{width:'100%',padding:'10px 12px',border:'1.5px solid var(--border-soft)',
              borderRadius:3,fontFamily:'monospace',fontSize:20,letterSpacing:8,
              background:'var(--paper)',color:'var(--ink)',outline:'none',textAlign:'center'}}/>
        </div>}
        {err&&<div className="alert-box alert-danger" style={{marginBottom:10,fontSize:12}}>{err}</div>}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="btn" onClick={onCancel}>取消</button>
          <button className="btn btn-primary" onClick={submit} disabled={busy}>
            {isSetup?'設定 PIN':'確認'}
          </button>
        </div>
        {!isSetup&&<div style={{marginTop:10,fontSize:10,opacity:.4,textAlign:'center'}}>
          忘記 PIN？清除瀏覽器 localStorage 可重置
        </div>}
      </div>
    </div>
  </div>
}

/* Single key row inside the manager */
function KeyRow({label,icon,storageKey,placeholder,hint,unlocked}){
  const[val,setVal]=useState(()=>localStorage.getItem(storageKey)||'');
  const[editing,setEditing]=useState(false);
  const[draft,setDraft]=useState('');
  const[saved,setSaved]=useState(false);
  const hasVal=!!val;

  function startEdit(){
    if(!unlocked)return;
    setDraft(val);setEditing(true);
  }
  function saveKey(){
    const t=draft.trim();
    if(t){localStorage.setItem(storageKey,t);setVal(t)}
    else{localStorage.removeItem(storageKey);setVal('')}
    setEditing(false);setSaved(true);setTimeout(()=>setSaved(false),1800);
  }
  function clearKey(){
    localStorage.removeItem(storageKey);setVal('');setEditing(false);
  }
  const masked=val.length>8?val.slice(0,6)+'•'.repeat(Math.min(val.length-10,20))+val.slice(-4):'•'.repeat(val.length||0);

  return <div style={{background:'var(--paper)',border:`1.5px solid ${hasVal?'var(--moss)':'var(--border-soft)'}`,
    borderRadius:5,padding:'11px 13px',marginBottom:10}}>
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:editing?8:0}}>
      <span style={{fontSize:18,flexShrink:0}}>{icon}</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:12,fontWeight:700,color:'var(--ink)',marginBottom:1}}>{label}</div>
        {!editing&&<div style={{fontSize:10,fontFamily:'monospace',color:hasVal?'var(--moss)':'var(--ink-soft)',opacity:hasVal?1:.4}}>
          {hasVal?(unlocked?masked:'••••••••••••  (已設定，鎖定中)'):'未設定'}
        </div>}
      </div>
      <div style={{display:'flex',gap:5,flexShrink:0}}>
        {saved&&<span style={{fontSize:11,color:'var(--moss)',fontWeight:700}}>✓ 已儲存</span>}
        {!editing&&unlocked&&<button className="btn btn-sm" onClick={startEdit}
          style={{fontSize:11,padding:'4px 10px',background:hasVal?'var(--washi2)':'var(--ink-soft)',color:hasVal?'var(--ink-soft)':'var(--washi)'}}>
          {hasVal?'編輯':'+ 設定'}
        </button>}
        {!editing&&unlocked&&hasVal&&<button className="btn btn-sm" onClick={clearKey}
          style={{fontSize:11,padding:'4px 8px',color:'#8b2a2a',borderColor:'#c8a0a0',background:'none'}}>✕</button>}
      </div>
    </div>
    {editing&&<>
      <input autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
        onKeyDown={e=>{if(e.key==='Enter')saveKey();if(e.key==='Escape')setEditing(false)}}
        placeholder={placeholder}
        style={{width:'100%',padding:'9px 11px',border:'1.5px solid var(--indigo)',borderRadius:3,
          fontFamily:'monospace',fontSize:12,background:'var(--paper)',color:'var(--ink)',
          outline:'none',marginBottom:7,boxSizing:'border-box'}}/>
      {hint&&<div style={{fontSize:10,opacity:.45,marginBottom:8,lineHeight:1.6}}>{hint}</div>}
      <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
        <button className="btn btn-sm" onClick={()=>setEditing(false)}>取消</button>
        <button className="btn btn-sm btn-primary" onClick={saveKey}>儲存</button>
      </div>
    </>}
  </div>
}

/* The full API Key Manager panel */
function ApiKeyManager(){
  const[unlocked,setUnlocked]=useState(false);
  const[showPinDialog,setShowPinDialog]=useState(false);
  const[pinAction,setPinAction]=useState(''); /* 'unlock' | 'setup' | 'change' | 'remove' */
  const[pinSet,setPinSet]=useState(hasPin);
  /* Auto-lock after 3 minutes of being unlocked */
  const lockTimer=useRef(null);
  function resetLockTimer(){
    clearTimeout(lockTimer.current);
    lockTimer.current=setTimeout(()=>{setUnlocked(false)},3*60*1000);
  }
  useEffect(()=>{if(unlocked)resetLockTimer();return()=>clearTimeout(lockTimer.current)},[unlocked]);

  function requestUnlock(){setPinAction('unlock');setShowPinDialog(true)}
  function requestSetupPin(){setPinAction('setup');setShowPinDialog(true)}
  function requestChangePin(){setPinAction('change');setShowPinDialog(true)}
  function requestRemovePin(){setPinAction('remove');setShowPinDialog(true)}

  function onPinSuccess(){
    setShowPinDialog(false);
    if(pinAction==='unlock'){setUnlocked(true);resetLockTimer()}
    else if(pinAction==='setup'){setPinSet(true);setUnlocked(true);resetLockTimer();showToast('✓ PIN 碼已設定')}
    else if(pinAction==='change'){setPinSet(true);showToast('✓ PIN 碼已更新')}
    else if(pinAction==='remove'){clearPin();setPinSet(false);setUnlocked(true);showToast('PIN 碼已移除')}
  }

  const KEYS=[
    {label:'Anthropic (Claude AI)',icon:'🤖',storageKey:'anthropic-key',placeholder:'sk-ant-api03-…',
     hint:'取得：console.anthropic.com → API Keys\n用於：AI 行程生成、AI 解析、收據掃描'},
    {label:'OpenWeatherMap',icon:'🌤',storageKey:'weather-key',placeholder:'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx',
     hint:'取得：openweathermap.org → My API Keys（免費，1000次/天）\n用於：天氣預報（備用，目前使用 Open-Meteo 免費版）'},
    {label:'Google Maps / Places',icon:'🗺️',storageKey:'gmaps-key',placeholder:'AIzaSy…',
     hint:'取得：console.cloud.google.com → APIs & Services → Credentials\n用於：地址自動補全、地圖顯示（需啟用 Maps JS API + Places API）'},
  ];

  return <div style={{background:'var(--washi2)',border:'1.5px solid var(--border)',borderRadius:6,padding:'14px 16px',marginBottom:14}}>
    {/* Header */}
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
      <span style={{fontSize:18}}>🔐</span>
      <div style={{flex:1}}>
        <div className="showa-title" style={{fontWeight:700,fontSize:13}}>API 金鑰管理</div>
        <div style={{fontSize:10,opacity:.5,marginTop:1}}>所有金鑰僅存於本機 localStorage，不會上傳或包含在任何匯出中</div>
      </div>
      {unlocked
        ?<button className="btn btn-sm" onClick={()=>setUnlocked(false)}
          style={{fontSize:11,background:'var(--moss)',color:'white',borderColor:'var(--moss)'}}>🔓 鎖定</button>
        :<button className="btn btn-sm btn-primary" onClick={pinSet?requestUnlock:requestSetupPin}
          style={{fontSize:11}}>
          {pinSet?'🔒 解鎖':'設定 PIN'}
        </button>}
    </div>

    {/* Security status bar */}
    <div style={{display:'flex',gap:6,alignItems:'center',padding:'7px 10px',
      borderRadius:4,marginBottom:12,fontSize:11,
      background:pinSet?(unlocked?'rgba(74,103,65,.1)':'rgba(46,74,122,.08)'):'rgba(184,86,30,.08)',
      border:`1px solid ${pinSet?(unlocked?'var(--moss)':'var(--indigo)'):'var(--persimmon)'}`,
      color:pinSet?(unlocked?'var(--moss)':'var(--indigo)'):'var(--persimmon)'}}>
      <span style={{fontSize:14}}>{pinSet?(unlocked?'🔓':'🔒'):'⚠️'}</span>
      <span style={{flex:1,fontWeight:600}}>
        {!pinSet&&'尚未設定 PIN 碼 — 任何人都可查看金鑰'}
        {pinSet&&!unlocked&&'已鎖定 — 點擊「解鎖」以查看或編輯金鑰'}
        {pinSet&&unlocked&&'已解鎖 — 3分鐘無操作後自動鎖定'}
      </span>
    </div>

    {/* Key rows */}
    {KEYS.map(k=><KeyRow key={k.storageKey} {...k} unlocked={unlocked||!pinSet}/>)}

    {/* PIN management */}
    <div style={{borderTop:'1px dashed var(--border-soft)',paddingTop:10,marginTop:4}}>
      <div style={{fontSize:10,fontWeight:700,opacity:.4,letterSpacing:'.08em',marginBottom:8}}>PIN 碼管理</div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {!pinSet&&<button className="btn btn-sm btn-primary" onClick={requestSetupPin} style={{fontSize:11}}>🔑 設定 PIN 碼保護</button>}

      <div style={{fontSize:10,opacity:.38,marginTop:8,lineHeight:1.7}}>

        發佈到 GitHub Pages 後，每位使用者的 PIN 和金鑰都是獨立儲存於其自己的瀏覽器中。
      </div>
    </div>

    {/* PIN dialog */}
    {showPinDialog&&<PinDialog
      title={pinAction==='setup'||pinAction==='change'?'設定 PIN 碼':'輸入 PIN 碼解鎖'}

        pinAction==='unlock'?'輸入你的 PIN 碼以查看及編輯 API 金鑰':

        '輸入目前的 PIN 碼以確認移除保護'
      }
      isSetup={pinAction==='setup'||pinAction==='change'}
      onSuccess={onPinSuccess}
      onCancel={()=>setShowPinDialog(false)}
    />}
  </div>
}

  /* Re-sync form whenever the trip changes (e.g. switching between trips) */
  useEffect(()=>setForm({...trip}),[trip.id]);
  function save(){
    // Never save API keys inside trip data — they stay in localStorage under their own keys
    const{gmapsKey,...safeForm}=form;
    const newDur=Math.max(1,Number(safeForm.duration)||1);
    safeForm.duration=newDur;
    setTrip(t=>{
      const currentDays=t.days||[];
      let newDays=[...currentDays];
      if(newDur>currentDays.length){
        /* Add empty days to match new duration */
        while(newDays.length<newDur){
          newDays.push({id:uid(),city:t.destination||'',items:[]});
        }
      } else if(newDur<currentDays.length){
        /* Trim extra days */
        newDays=newDays.slice(0,newDur);
      }
      return{...t,...safeForm,days:newDays};
    });
    showToast('✓ 設定已儲存');
  }

  function exportTxt(){
    const c=`旅行計劃：${trip.name}\n目的地：${trip.destination}\n日期：${trip.startDate}〜${addDays(trip.startDate,(trip.duration||1)-1)}\n\n${'='.repeat(30)}\n行程\n${'='.repeat(30)}\n${(trip.days||[]).map((d,i)=>`\nDay ${i+1} — ${d.city}\n${(d.items||[]).map(it=>`  ${it.time||''} ${it.name}${it.location?' @ '+it.location:''}${it.duration?' ('+it.duration+'分)':''}`).join('\n')}`).join('')}\n\n${'='.repeat(30)}\n預約\n${'='.repeat(30)}\n${(trip.bookings||[]).map(b=>`• ${b.name}${b.type==='flight'?' '+b.flightNum:''}`).join('\n')}\n\n${'='.repeat(30)}\n消費記錄\n${'='.repeat(30)}\n${(trip.expenses||[]).map(e=>`• ${e.name}: ${e.currency} ${e.amount}`).join('\n')}\n\n${'='.repeat(30)}\n日記\n${'='.repeat(30)}\n${Object.entries(trip.journal||{}).map(([k,v])=>`\n${k}\n${v}`).join('\n')}`;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/plain;charset=utf-8'}));a.download=`${trip.name}-行程摘要.txt`;a.click();
  }
  return <div style={{padding:'14px 14px 0'}}>
    <Field label="旅行名稱"><input value={form.name||''} onChange={u('name')}/></Field>
    <Field label="目的地">
      <DestinationPicker value={form.destination||''} onChange={v=>setForm(p=>({...p,destination:v}))}/>
    </Field>
    
      <Field label="出發日期"><input type="date" value={form.startDate||''} onChange={u('startDate')}/></Field>
      <Field label="天數"><input type="number" min="1" value={form.duration||1} onChange={u('duration')}/></Field>
    
    
      <Field label="總預算"><input type="number" value={form.budget||0} onChange={u('budget')}/></Field>
      <Field label="貨幣"><select value={form.currency||'HKD'} onChange={u('currency')}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</select></Field>
    
    <Field label="主題色">
      <div style={{display:'flex',gap:10,marginTop:5}}>
        {THEME_COLORS.map((c,i)=>(
          <div key={c} style={{textAlign:'center'}}>
            <div className={`color-swatch ${form.color===c?'selected':''}`} style={{background:c}} onClick={()=>setForm(p=>({...p,color:c}))}/>
            <div style={{fontSize:9,opacity:.45,marginTop:2,fontFamily:'serif'}}>{THEME_NAMES[i]}</div>
          </div>
        ))}
      </div>
    </Field>

    <div className="showa-divider" style={{margin:'14px 0 12px'}}/>

    {/* ── Language ── */}
    <div style={{marginBottom:16}}>
      <div className="section-title">語言 / Language / 言語</div>
      <div style={{display:'flex',gap:8}}>
        {[['zh','中文'],['en','English'],['ja','日本語']].map(([code,label])=>(
          <button key={code}
            className={`btn ${currentLang===code?'btn-primary':''}`}
            style={{flex:1,fontSize:12,padding:'7px 4px'}}
            onClick={()=>{localStorage.setItem('app-lang',code);window.location.reload()}}>
            {label}
          </button>
        ))}
      </div>
    </div>

    <div className="showa-divider" style={{margin:'14px 0 12px'}}/>

    {/* ── API Keys & Privacy ── */}
    <ApiKeyManager/>
    <div style={{display:'flex',gap:7}}>
      <button className="btn btn-primary" style={{flex:1}} onClick={save}>儲存設定</button>
      <button className="btn btn-indigo" onClick={exportTxt}>📄 匯出</button>
    </div>
    <div className="showa-divider" style={{margin:'12px 0'}}/>
    <div className="section-title">共享與備份</div>
    <FriendKeyShare/>
    <BackupPanel trips={[trip]} onRestore={()=>{}}/>
    <div className="showa-divider" style={{margin:'12px 0'}}/>
    <button className="btn btn-danger" style={{width:'100%'}} onClick={()=>setShowDel(true)}>🗑 刪除此行程</button>
    {showDel&&<Modal title="確認刪除" onClose={()=>setShowDel(false)}>
      <p style={{marginBottom:14,fontSize:13,opacity:.7}}>確定刪除「{trip.name}」？無法還原。</p>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}><button className="btn" onClick={()=>setShowDel(false)}>取消</button><button className="btn btn-danger" onClick={onDelete}>確認刪除</button></div>
    </Modal>}

}

/* TABS keys are internal; labels come from LANGS */
const TAB_KEYS=['行程','預約','記帳','購物','準備','設定'];
const TAB_EMOJI={行程:'⛩',預約:'✈️',記帳:'💴',購物:'🛍',準備:'🧳',設定:'⚙️'};


/* ════════════════════════════════════════
   STICKER LAYER — per tab, per trip
════════════════════════════════════════ */
function getStickerKey(tripId,tab){return`sk-${tripId}-${tab}`}
function loadTabStickers(tripId,tab){try{return JSON.parse(localStorage.getItem(getStickerKey(tripId,tab)))||[]}catch{return[]}}
function saveTabStickers(tripId,tab,s){try{localStorage.setItem(getStickerKey(tripId,tab),JSON.stringify(s))}catch{}}

/* FAB right position — distance from right edge of the app container */
const FAB_RIGHT_STICKER='calc(50% - 240px + 14px)';

function StickerLayer({tripId,tab}){
  const[stickers,setStickers]=useState(()=>loadTabStickers(tripId,tab));
  const[showPicker,setShowPicker]=useState(false);
  const[selected,setSelected]=useState(null);
  const dragRef=useRef(null);   /* {id,cx,cy,ox,oy,startX,startY,moved,wasSel} */
  const resizeRef=useRef(null); /* {id,cx,os} */
  const selectedRef=useRef(null);
  const appRectRef=useRef({top:0,left:0,width:375,height:812});
  const[appRect,setAppRect]=useState({top:0,left:0,width:375,height:812});

  useEffect(()=>{selectedRef.current=selected},[selected]);
  useEffect(()=>{appRectRef.current=appRect},[appRect]);

  /* Measure app container */
  useEffect(()=>{
    function measure(){
      const el=document.querySelector('.app');
      if(!el)return;
      const r=el.getBoundingClientRect();
      const rect={top:r.top+window.scrollY,left:r.left+window.scrollX,
        width:r.width,height:Math.max(r.height,document.documentElement.scrollHeight)};
      setAppRect(rect);appRectRef.current=rect;
    }
    measure();
    const el=document.querySelector('.app');
    const ro=window.ResizeObserver?new ResizeObserver(measure):null;
    if(ro&&el)ro.observe(el);
    window.addEventListener('scroll',measure,{passive:true});
    window.addEventListener('resize',measure);
    return()=>{if(ro)ro.disconnect();window.removeEventListener('scroll',measure);window.removeEventListener('resize',measure)};
  },[]);

  useEffect(()=>saveTabStickers(tripId,tab,stickers),[tripId,tab,stickers]);

  function addSticker(k){
    const id=uid();
    const ar=appRectRef.current;
    const vy=Math.max(80,(window.scrollY-ar.top)+180+Math.random()*100);
    setStickers(s=>[...s,{id,k,x:ar.width/2-45+Math.random()*40,y:vy,sz:90,rot:0}]);
    setShowPicker(false);setSelected(id);
  }
  function del(id){setStickers(s=>s.filter(x=>x.id!==id));if(selectedRef.current===id)setSelected(null)}
  function upd(id,patch){setStickers(s=>s.map(x=>x.id===id?{...x,...patch}:x))}

  /* Global pointermove / pointerup for drag & resize */
  useEffect(()=>{
    function mv(e){
      if(dragRef.current){
        const{id,cx,cy,ox,oy,startX,startY}=dragRef.current;
        const dx=e.clientX-startX,dy=e.clientY-startY;
        if(Math.abs(dx)>4||Math.abs(dy)>4)dragRef.current.moved=true;
        if(dragRef.current.moved){
          const ny=e.clientY+window.scrollY-appRectRef.current.top;
          setStickers(s=>s.map(x=>x.id===id?{...x,
            x:Math.max(0,ox+(e.clientX-cx)),
            y:Math.max(0,oy+(ny-cy))}:x));
        }
      }
      if(resizeRef.current){
        const{id,cx,os}=resizeRef.current;
        setStickers(s=>s.map(x=>x.id===id?{...x,sz:Math.max(32,Math.min(220,os+(e.clientX-cx)))}:x));
      }
    }
    function up(){dragRef.current=null;resizeRef.current=null}
    window.addEventListener('pointermove',mv);
    window.addEventListener('pointerup',up);
    return()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};
  },[]);

  const sel=stickers.find(x=>x.id===selected);
  const layerH=Math.max(appRect.height,document.body.scrollHeight||0);

  /* ── Button style helper ── */
  const btnStyle=(bg,cursor='pointer')=>({
    position:'absolute',width:28,height:28,borderRadius:'50%',
    background:bg,color:'white',border:'2.5px solid white',
    display:'flex',alignItems:'center',justifyContent:'center',
    fontSize:13,cursor,
    boxShadow:'0 2px 8px rgba(0,0,0,.5)',
    pointerEvents:'all',touchAction:'none',userSelect:'none',zIndex:9010,
  });

  /* ── Single portal layer: sticker images + control buttons as siblings ── */
  /* Control buttons sit at document-absolute coords alongside the image, NOT inside
     the rotated div — so they're always axis-aligned regardless of sticker rotation */
  const layer=<div style={{position:'absolute',top:appRect.top,left:appRect.left,
      width:appRect.width,height:layerH,pointerEvents:'none',zIndex:9000}}>
    {stickers.map(s=>{
      const isSel=s.id===selected;
      /* ── Sticker image div (rotated) ── */
      const imgDiv=<div key={'img-'+s.id}
        style={{position:'absolute',left:s.x,top:s.y,width:s.sz,height:s.sz,
          transform:`rotate(${s.rot||0}deg)`,transformOrigin:'50% 50%',
          pointerEvents:'all',touchAction:'none',userSelect:'none',WebkitUserSelect:'none',
          cursor:'grab',zIndex:isSel?9003:9001}}
        onPointerDown={e=>{
          /* preventDefault stops browser from firing a ghost `click` after pointerup,
             which would immediately re-toggle selection */
          e.preventDefault();e.stopPropagation();
          e.currentTarget.setPointerCapture(e.pointerId);
          const rawY=e.clientY+window.scrollY-appRectRef.current.top;
          dragRef.current={id:s.id,cx:e.clientX,cy:rawY,ox:s.x,oy:s.y,
            startX:e.clientX,startY:e.clientY,moved:false,wasSel:isSel};
          if(!isSel)setSelected(s.id);
        }}
        onPointerUp={e=>{
          const d=dragRef.current;
          if(!d||d.id!==s.id)return;
          const wasSel=d.wasSel,moved=d.moved;
          dragRef.current=null;
          /* Tap on already-selected sticker = deselect */
          if(!moved&&wasSel)setSelected(null);
        }}>
        <img src={STICKERS[s.k]}
          style={{width:'100%',height:'100%',objectFit:'contain',display:'block',pointerEvents:'none'}}
          draggable={false}/>
        {isSel&&<div style={{position:'absolute',inset:-2,
          border:'2px dashed rgba(46,74,122,.75)',borderRadius:4,pointerEvents:'none'}}/>}
      </div>;

      /* ── Control buttons (NOT inside rotated div — no rotation transform) ── */
      const ctrlBtns=isSel&&<React.Fragment key={'ctrl-'+s.id}>
        {/* ✕ Delete — top-right corner */}
        <div style={{...btnStyle('#8b2a2a'),left:s.x+s.sz-14,top:s.y-14}}
          onPointerDown={e=>{e.preventDefault();e.stopPropagation();del(s.id);}}>✕</div>
        {/* ⤡ Resize — bottom-right corner */}
        <div style={{...btnStyle('var(--indigo)','se-resize'),left:s.x+s.sz-14,top:s.y+s.sz-14}}
          onPointerDown={e=>{
            e.preventDefault();e.stopPropagation();
            e.currentTarget.setPointerCapture(e.pointerId);
            resizeRef.current={id:s.id,cx:e.clientX,os:s.sz};
          }}>⤡</div>
        {/* ↺ Rotate left — bottom-left corner */}
        <div style={{...btnStyle('var(--moss)'),left:s.x-14,top:s.y+s.sz-14}}
          onPointerDown={e=>{e.preventDefault();e.stopPropagation();upd(s.id,{rot:(s.rot||0)-15});}}>↺</div>
        {/* ↻ Rotate right — bottom-center */}
        <div style={{...btnStyle('var(--moss)'),left:s.x+s.sz/2-14,top:s.y+s.sz-14}}
          onPointerDown={e=>{e.preventDefault();e.stopPropagation();upd(s.id,{rot:(s.rot||0)+15});}}>↻</div>
      </React.Fragment>;

      return <React.Fragment key={s.id}>{imgDiv}{ctrlBtns}</React.Fragment>;
    })}
  </div>;

  return <>
    {ReactDOM.createPortal(layer,document.body)}
    <button onPointerDown={e=>{e.stopPropagation();setShowPicker(p=>!p);setSelected(null)}}
      style={{position:'fixed',bottom:20,right:'max(14px, calc(50% - 226px))',
        width:42,height:42,borderRadius:'50%',
        background:showPicker?'var(--ink)':'var(--rose)',
        border:'2px solid var(--ink)',color:'var(--washi)',
        fontSize:17,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',
        boxShadow:'3px 3px 0 var(--ink)',zIndex:9100,transition:'all .15s'}}>🏷️</button>
    {showPicker&&<div onPointerDown={e=>e.stopPropagation()}
      style={{position:'fixed',bottom:70,right:'max(14px, calc(50% - 226px))',
        width:'min(258px, calc(100vw - 28px))',background:'var(--paper)',
        border:'1.5px solid var(--border)',borderRadius:8,
        boxShadow:'4px 4px 0 var(--ink)',zIndex:9200,overflow:'hidden'}}>
      <div style={{padding:'9px 12px 8px',borderBottom:'1px solid var(--border-soft)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:12,fontWeight:700,fontFamily:"'Shippori Mincho',serif",color:'var(--ink)'}}>🏷️ 貼紙</span>
        <span style={{fontSize:10,opacity:.4}}>{stickers.length} 個已貼</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:5,padding:'9px',maxHeight:190,overflowY:'auto'}}>
        {Object.keys(STICKERS).map(k=>(
          <div key={k} onPointerDown={()=>addSticker(k)}
            style={{aspectRatio:'1',cursor:'pointer',padding:3,borderRadius:4,
              border:'1.5px solid var(--border-soft)',background:'var(--washi2)',
              display:'flex',alignItems:'center',justifyContent:'center'}}>
            <img src={STICKERS[k]} style={{width:'100%',height:'100%',objectFit:'contain'}}/>
          </div>
        ))}
      </div>
      {selected&&sel&&<div style={{padding:'7px 10px 9px',borderTop:'1px solid var(--border-soft)',display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontSize:10,opacity:.45}}>大小：</span>
        <button onPointerDown={()=>upd(sel.id,{sz:Math.max(32,sel.sz-20)})} style={{fontSize:12,padding:'3px 9px',border:'1px solid var(--border-soft)',borderRadius:3,background:'none',cursor:'pointer',fontFamily:'inherit'}}>－</button>
        <span style={{fontSize:11,opacity:.45,minWidth:28,textAlign:'center'}}>{sel.sz}</span>
        <button onPointerDown={()=>upd(sel.id,{sz:Math.min(220,sel.sz+20)})} style={{fontSize:12,padding:'3px 9px',border:'1px solid var(--border-soft)',borderRadius:3,background:'none',cursor:'pointer',fontFamily:'inherit'}}>＋</button>
        <button onPointerDown={()=>del(sel.id)} style={{fontSize:10,padding:'3px 8px',border:'1px solid #c8a0a0',borderRadius:3,background:'none',cursor:'pointer',color:'#8b2a2a',fontFamily:'inherit',marginLeft:'auto'}}>刪除</button>
      </div>}
      <div style={{padding:'5px 10px 7px',borderTop:'1px solid var(--border-soft)',fontSize:10,opacity:.35,textAlign:'center'}}>
        點擊選取 · 拖動移位 · 按鈕縮放旋轉刪除
      </div>
    </div>}
  </>
}

function TripDetail({trip,updateTrip,onBack,onDelete,allTrips}){

    <div style={{padding:'12px 12px 0',display:'flex',alignItems:'center'}}>
      <button className="back-btn" onClick={onBack}>← 返回</button>
    </div>

    <div className="tab-bar">
      {TAB_KEYS.map(k=><div key={k} className={`tab-item ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{TAB_EMOJI[k]} {(LANGS[currentLang]?.tabs||{})[k]||k}</div>)}

    {tab==='行程'&&<ItineraryTab trip={trip} setTrip={st}/>}
    {tab==='預約'&&<BookingsTab trip={trip} setTrip={st}/>}

}

/* #17 Home trip card — next activity */
function TripCard({trip,onClick,onEdit,onDelete}){
  const days=daysUntil(trip.startDate);
  const color=trip.color||'#2d2418';
  const prepDone=(trip.prep||[]).filter(p=>p.done).length;
  const prepTotal=(trip.prep||[]).length;
  const[showMenu,setShowMenu]=useState(false);
  const nextActivity=useMemo(()=>{
    const now=new Date();
    const tripDay=Math.max(0,Math.floor((now-new Date(trip.startDate))/86400000));
    const dayData=(trip.days||[])[tripDay];
    if(!dayData)return null;
    const nowMins=now.getHours()*60+now.getMinutes();
    return (dayData.items||[]).find(it=>{const t=timeToMins(it.time);return t!==null&&t>nowMins});
  },[trip]);
  const isActive=days<=0&&days>-(trip.duration||1);
  return <div className="card trip-card animate-in" style={{marginBottom:11,position:'relative'}}>
    <div style={{position:'absolute',top:0,left:0,right:0,height:4,background:color,borderRadius:'3px 3px 0 0'}}/>
    {/* Main card area — tappable to open trip */}
    <div style={{paddingTop:6}} onClick={()=>{setShowMenu(false);onClick()}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div style={{flex:1,minWidth:0}}>
          <div className="showa-title" style={{fontSize:15,fontWeight:700,color,letterSpacing:'.08em'}}>{trip.name}</div>
          <div style={{fontSize:11,opacity:.5,marginTop:2}}>📍 {trip.destination}</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
          <span className="stamp" style={{color,fontSize:10}}>
            {days>0?`${days}日後`:days===0?'今日出發':'旅途中'}
          </span>
          {/* ⋯ menu button */}
          <button
            onClick={e=>{e.stopPropagation();setShowMenu(m=>!m)}}
            style={{background:'none',border:'1px solid var(--border-soft)',borderRadius:4,
              width:28,height:28,cursor:'pointer',fontSize:14,color:'var(--ink-soft)',
              display:'flex',alignItems:'center',justifyContent:'center',opacity:.6,flexShrink:0}}>
            ⋯
          </button>
        </div>
      </div>
      {isActive&&nextActivity&&(
        <div style={{marginTop:8,background:`${color}14`,border:`1px solid ${color}33`,borderRadius:3,padding:'5px 9px',fontSize:11}}>
          <span style={{opacity:.55}}>下一站：</span>
          <span style={{fontWeight:600,color}}>{CAT_EMOJI[nextActivity.cat]||'📌'} {nextActivity.name}</span>
          {nextActivity.time&&<span style={{opacity:.5}}> · {nextActivity.time}</span>}
          {nextActivity.location&&<span style={{opacity:.4}}> · {nextActivity.location}</span>}
        </div>
      )}
      <div className="showa-divider" style={{margin:'9px 0 7px'}}/>
      <div style={{display:'flex',gap:10,fontSize:11,opacity:.5,flexWrap:'wrap'}}>
        <span>📅 {trip.startDate}</span><span>⏱ {trip.duration}天</span>
        <span>💰 {trip.currency} {Number(trip.budget||0).toLocaleString()}</span>
      </div>
      {prepTotal>0&&<div style={{marginTop:8}}>
        <div style={{fontSize:10,opacity:.4,marginBottom:3}}>行李準備 {prepDone}/{prepTotal}</div>
        <div className="progress-bar"><div className="progress-fill" style={{width:`${prepTotal?prepDone/prepTotal*100:0}%`,background:color}}/></div>
      </div>}
    </div>
    {/* Dropdown menu */}
    {showMenu&&<div onClick={e=>e.stopPropagation()}
      style={{position:'absolute',top:32,right:10,
        background:'var(--paper)',border:'1.5px solid var(--border)',borderRadius:6,
        boxShadow:'3px 3px 0 var(--border)',zIndex:200,overflow:'hidden',minWidth:130}}>
      <button onClick={()=>{setShowMenu(false);onEdit()}}
        style={{display:'block',width:'100%',padding:'10px 14px',background:'none',border:'none',
          cursor:'pointer',textAlign:'left',fontSize:13,fontFamily:'inherit',color:'var(--ink-soft)',
          borderBottom:'1px solid var(--border-soft)'}}>
        ✏️ 編輯行程資料
      </button>
      <button onClick={()=>{setShowMenu(false);if(window.confirm(`確定刪除「${trip.name}」？`))onDelete()}}
        style={{display:'block',width:'100%',padding:'10px 14px',background:'none',border:'none',
          cursor:'pointer',textAlign:'left',fontSize:13,fontFamily:'inherit',color:'#8b2a2a'}}>
        🗑️ 刪除行程
      </button>
    </div>}
  </div>
}


/* ════════════════════════════════════════
   DESTINATION PICKER
   Popular destinations + free text fallback
════════════════════════════════════════ */
function DestinationPicker({value,onChange}){
  const[showPicker,setShowPicker]=useState(!value);
  const[query,setQuery]=useState(value||'');

  useEffect(()=>{setQuery(value||'')},[value]);

  function pick(city){
    setQuery(city);onChange(city);setShowPicker(false);
  }

  return <div>
    {/* Text input — always visible */}
    <div style={{position:'relative'}}>
      <input
        value={query}
        onChange={e=>{setQuery(e.target.value);onChange(e.target.value)}}
        onFocus={()=>setShowPicker(true)}
        placeholder="輸入或選擇目的地城市"
        style={{width:'100%',padding:'10px 36px 10px 11px',border:'1.5px solid var(--border-soft)',
          borderRadius:3,fontFamily:'inherit',fontSize:13,background:'var(--paper)',color:'var(--ink)',
          outline:'none',boxSizing:'border-box'}}
      />
      {query&&<span onClick={()=>{setQuery('');onChange('');setShowPicker(true)}}
        style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',
          cursor:'pointer',fontSize:14,opacity:.35,lineHeight:1}}>✕</span>}
    </div>

    {/* Popular city picker */}
    {showPicker&&<div style={{marginTop:6,background:'var(--washi2)',border:'1.5px solid var(--border-soft)',
      borderRadius:6,padding:'10px 10px 6px',maxHeight:240,overflowY:'auto'}}>
      <div style={{fontSize:10,opacity:.45,marginBottom:8,letterSpacing:'.06em'}}>熱門目的地（點擊選取）</div>
      {POPULAR_DESTS.map(group=>(
        <div key={group.region} style={{marginBottom:9}}>
          <div style={{fontSize:10,fontWeight:700,opacity:.5,marginBottom:5}}>{group.region}</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
            {group.cities.map(city=>(
              <button key={city} onClick={()=>pick(city)}
                style={{padding:'4px 10px',borderRadius:20,border:'1.5px solid var(--border-soft)',
                  background:value===city?'var(--persimmon)':'var(--paper)',
                  color:value===city?'white':'var(--ink-soft)',
                  fontFamily:'inherit',fontSize:12,cursor:'pointer',
                  fontWeight:value===city?700:400,transition:'all .15s'}}>
                {city}
              </button>
            ))}
          </div>
        </div>
      ))}
      <div style={{borderTop:'1px solid var(--border-soft)',paddingTop:7,marginTop:3}}>
        <div style={{fontSize:10,opacity:.4}}>找不到城市？直接在上方輸入即可</div>
      </div>
    </div>}
  </div>
}


/* ════════════════════════════════════════
   QUICK EDIT MODAL — edit from home screen
════════════════════════════════════════ */
function QuickEditModal({trip,onSave,onClose}){
  const[name,setName]=useState(trip.name||'');
  const[dest,setDest]=useState(trip.destination||'');
  return <Modal title="編輯行程" onClose={onClose}>
    <Field label="旅行名稱">
      <input value={name} onChange={e=>setName(e.target.value)} placeholder="旅行名稱"/>
    </Field>
    <Field label="目的地">
      <DestinationPicker value={dest} onChange={setDest}/>
    </Field>
    <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:4}}>
      <button className="btn" onClick={onClose}>取消</button>
      <button className="btn btn-primary" onClick={()=>{if(name.trim()&&dest.trim())onSave(name.trim(),dest.trim())}}>儲存</button>
    </div>
  </Modal>
}

function NewTripModal({onSave,onClose}){
  const[f,setF]=useState({name:'',destination:'',startDate:new Date().toISOString().slice(0,10),duration:7,budget:100000,currency:'HKD',color:THEME_COLORS[0]});
  const u=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  function save(){
    if(!f.name||!f.destination)return;
    const days=Array.from({length:Number(f.duration)||7},()=>({id:uid(),city:f.destination,items:[]}));
    onSave({...f,days,prep:DEFAULT_PREP.map(p=>({...p,id:uid()})),id:uid(),bookings:[],expenses:[],shopping:[],journal:{},weatherEffect:'none'});
  }
  return <Modal title="新建旅行計劃" onClose={onClose}>
    <Field label="旅行名稱"><input value={f.name} onChange={u('name')} placeholder="例：東京春日之旅"/></Field>
    <Field label="目的地">
      <DestinationPicker value={f.destination} onChange={v=>setF(p=>({...p,destination:v}))}/>
    </Field>
    
      <Field label="出發日期"><input type="date" value={f.startDate} onChange={u('startDate')}/></Field>
      <Field label="天數"><input type="number" min="1" max="60" value={f.duration} onChange={u('duration')}/></Field>
    
    
      <Field label="預算"><input type="number" value={f.budget} onChange={u('budget')}/></Field>
      <Field label="貨幣"><select value={f.currency} onChange={u('currency')}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</select></Field>
    
    <Field label="主題色">
      <div style={{display:'flex',gap:10,marginTop:5}}>
        {THEME_COLORS.map((c,i)=><div key={c} style={{textAlign:'center'}}><div className={`color-swatch ${f.color===c?'selected':''}`} style={{background:c}} onClick={()=>setF(p=>({...p,color:c}))}/><div style={{fontSize:9,opacity:.45,marginTop:2,fontFamily:'serif'}}>{THEME_NAMES[i]}</div></div>)}
      </div>
    </Field>
    <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:6}}>
      <button className="btn" onClick={onClose}>取消</button>
      <button className="btn btn-accent" onClick={save}>出發！建立行程</button>
    </div>
  </Modal>
}

function loadSharedTrip(){
  try{const p=new URLSearchParams(location.search);const e=p.get('trip');if(e)return JSON.parse(decodeURIComponent(escape(atob(e))))}catch{}return null;
}

function App(){
  const[trips,setTrips]=useStorage('showatravel-v5',[]);
  const[activeId,setActiveId]=useState(null);
  const[showNew,setShowNew]=useState(false);
  const[showBackup,setShowBackup]=useState(false);
  const[editingTrip,setEditingTrip]=useState(null);
  const[sharedTrip,setSharedTrip]=useState(null);
  const curLang=currentLang; /* read global */
  useEffect(()=>{const t=loadSharedTrip();if(t)setSharedTrip(t)},[]);
  const activeTrip=sharedTrip||(trips.find(t=>t.id===activeId));
  const updateTrip=t=>{if(sharedTrip){setSharedTrip(t);return}setTrips(ts=>ts.map(x=>x.id===t.id?t:x))};
  const deleteTrip=()=>{setTrips(ts=>ts.filter(x=>x.id!==activeId));setActiveId(null);setSharedTrip(null)};
  const addTrip=t=>{setTrips(ts=>[t,...ts]);setActiveId(t.id);setShowNew(false)};
  const saveShared=()=>{setTrips(ts=>[sharedTrip,...ts.filter(x=>x.id!==sharedTrip.id)]);setSharedTrip(null);setActiveId(sharedTrip.id)};

  if(activeTrip)return <div className="app">
    <WeatherCanvas effect={activeTrip.weatherEffect||'none'}/>
    {sharedTrip&&<div style={{background:'var(--gold)',padding:'7px 14px',fontSize:12,display:'flex',justifyContent:'space-between',alignItems:'center',zIndex:70,position:'relative'}}>
      <span>📤 共享行程（唯讀）</span>
      <button className="btn btn-sm" onClick={saveShared}>儲存到我的行程</button>
    </div>}
    <TripDetail trip={activeTrip} updateTrip={updateTrip} onBack={()=>{setActiveId(null);setSharedTrip(null)}} onDelete={deleteTrip} allTrips={trips}/>
    <Toasts/>
  </div>;

  return <div className="app">
    <div className="home-header">
      <div style={{fontSize:30,marginBottom:5,filter:'sepia(40%)'}}>⛩️</div>
      <div className="showa-title" style={{fontSize:23,color:'var(--ink)',letterSpacing:'.18em',fontWeight:700}}>{L('appName')}</div>
      <div style={{fontSize:11,color:'var(--ink-soft)',opacity:.4,marginTop:3,letterSpacing:'.14em',fontFamily:'serif'}}>{L('tagline')}</div>
      <div style={{display:'flex',justifyContent:'center',gap:8,marginTop:8}}>
        <button className="btn btn-sm" style={{fontSize:10,opacity:.6}} onClick={()=>setShowBackup(true)}>☁️ 備份/還原</button>
      </div>
      <div style={{display:'flex',justifyContent:'center',gap:8,marginTop:6}}>
        <div style={{height:1,width:36,background:'var(--border)',alignSelf:'center'}}/>
        <div style={{fontSize:10,opacity:.28,letterSpacing:'.1em'}}>あなたの旅を彩る</div>
        <div style={{height:1,width:36,background:'var(--border)',alignSelf:'center'}}/>
      </div>
    </div>
    <div style={{padding:'12px 12px 0'}}>
      {trips.length===0&&<div className="empty-state"><div className="emoji">🌏</div><div style={{fontSize:13,fontWeight:500}}>還沒有旅行計劃</div><div style={{fontSize:11,marginTop:3}}>點擊 ＋ 開始規劃你的旅程</div></div>}
      {[...trips].sort((a,b)=>new Date(b.startDate)-new Date(a.startDate)).map(t=>(
        <TripCard key={t.id} trip={t}
          onClick={()=>setActiveId(t.id)}
          onEdit={()=>setEditingTrip(t)}
          onDelete={()=>{setTrips(ts=>ts.filter(x=>x.id!==t.id));showToast(`已刪除「${t.name}」`,()=>setTrips(ts=>[t,...ts]))}}
        />
      ))}
      {editingTrip&&<QuickEditModal
        trip={editingTrip}
        onSave={(name,dest)=>{
          setTrips(ts=>ts.map(x=>x.id===editingTrip.id?{...x,name,destination:dest,days:(x.days||[]).map(d=>({...d,city:d.city===x.destination?dest:d.city}))}:x));
          setEditingTrip(null);showToast('✓ 已儲存');
        }}
        onClose={()=>setEditingTrip(null)}
      />}
    </div>
    <button className="fab" onClick={()=>setShowNew(true)}>＋</button>
    {showBackup&&<Modal title="☁️ 備份與還原" onClose={()=>setShowBackup(false)}>
      <BackupPanel trips={trips} onRestore={restored=>{setTrips(ts=>{const ids=new Set(ts.map(t=>t.id));return[...ts,...restored.filter(r=>!ids.has(r.id))]})}}/></Modal>}
    {showNew&&<NewTripModal onSave={addTrip} onClose={()=>setShowNew(false)}/>}
    <Toasts/>
    <div style={{height:72}}/>
  </div>;
}


/* ═══════════════════════════════════════════
   PROXY KEY LOADER — owner can share keys via URL hash
   Usage: index.html#ak=base64(anthropicKey)&wk=base64(weatherKey)&mk=base64(mapsKey)
   The key is stored locally then the hash is cleared from URL.
   Friend only needs to open the link once.
═══════════════════════════════════════════ */
(function loadKeysFromHash(){
  try{
    const hash=location.hash.replace('#','');
    if(!hash)return;
    const params=new URLSearchParams(hash);
    let loaded=false;
    const load=(param,lsKey)=>{
      const v=params.get(param);
      if(v&&!localStorage.getItem(lsKey)){
        try{localStorage.setItem(lsKey,decodeURIComponent(escape(atob(v))));loaded=true;}catch{}
      }
    };
    load('ak','anthropic-key');
    load('wk','weather-key');
    load('mk','gmaps-key');
    /* Legacy gk param */
    load('gk','gmaps-key');
    if(loaded){
      history.replaceState(null,'',location.pathname+location.search);
    }
  }catch(e){console.warn('Key load error',e)}
})();
